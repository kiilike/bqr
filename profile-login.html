                    </button>
                    <button class="button-social" onclick="console.log('register-apple clicked');">
                        <img src="images/apple.svg" alt="apple" width="20" height="20">
                    </button>
                </div>
            </div>







            <!--                                             -->
            <!--          LOGIN/REGISTER FORM alt 1/2        -->

        <!--          BOTTOM ACTIONS #1         -->
        <!--                                    -->
        <div class="login-footer">
            <button class="button-default button-default-medium login-button"
                onclick="console.log('login clicked');window.location.href='home.html';">Log

                Forgot your password?
            </button>
            <div class="login-footer-no-account">
                Don't have an account? <a href="profile-register.html">Register now</a>
            </div>
        </div>
