        <!--          BACK BUTTON #1        -->
        <!--                                -->

                <!-- checkbox ovlada zobrazenie, bude je svg#switch_off alebo svg#switch_on nastavene na block/hidden v styloch -->
                <input type="checkbox" id="switch" style="display: none;" />
                <label for="switch" style="cursor: pointer;">
                    <!-- switch-off -->
                    <svg id="switch_off" width="40" height="20" viewBox="0 0 40 20" fill="none"
                        xmlns="http://www.w3.org/2000/svg">

                        xmlns="http://www.w3.org/2000/svg">
                        <g id="Group 10">

                            <rect id="Rectangle 3580" x="22" y="2" width="16" height="16" rx="8" fill="white" />
                        </g>
                    </svg>
                </label>
